<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mallick Enterprise - Office Stationery</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800">

  <!-- কাস্টমার হেডার: শুধু নাম, সার্চ এবং কার্ট বাটন -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-30 px-4 py-3 shadow-sm">
    <div class="max-w-6xl mx-auto flex flex-wrap items-center justify-between gap-3">
      <a href="/" class="font-extrabold text-2xl text-blue-600 tracking-tight">MALLICK</a>
      
      <div class="flex-1 max-w-md mx-2">
        <input type="text" id="searchInput" oninput="filterCustomerProducts()" placeholder="Search items (paper, pen, file)..." class="w-full text-sm border border-slate-300 rounded-full px-4 py-2 focus:outline-blue-500 bg-slate-50" />
      </div>

      <button onclick="toggleCustomerCart()" class="bg-blue-600 hover:bg-blue-700 text-white text-sm font-semibold px-4 py-2 rounded-full flex items-center gap-2 shadow">
        🛒 Cart (<span id="cartCount">0</span>)
      </button>
    </div>
  </header>

  <!-- ক্যাটালগ সেকশন -->
  <main class="max-w-6xl mx-auto p-4 sm:p-6">
    <div class="flex gap-2 overflow-x-auto pb-4 mb-4 text-xs font-semibold text-slate-600" id="categoryTabs">
      <button onclick="filterCategory('All')" class="px-4 py-1.5 rounded-full bg-blue-600 text-white shadow">All Products</button>
      <button onclick="filterCategory('Paper & Notebooks')" class="px-4 py-1.5 rounded-full bg-white border border-slate-300 hover:bg-slate-100">Paper & Notebooks</button>
      <button onclick="filterCategory('Pens & Markers')" class="px-4 py-1.5 rounded-full bg-white border border-slate-300 hover:bg-slate-100">Pens & Markers</button>
      <button onclick="filterCategory('Files & Folders')" class="px-4 py-1.5 rounded-full bg-white border border-slate-300 hover:bg-slate-100">Files & Folders</button>
      <button onclick="filterCategory('Desk Accessories')" class="px-4 py-1.5 rounded-full bg-white border border-slate-300 hover:bg-slate-100">Desk Accessories</button>
    </div>

    <h2 class="text-xl font-bold text-slate-800 mb-4">Stationery Catalog</h2>
    <div id="productGrid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
      <p class="col-span-full text-center py-10 text-slate-400">Loading products...</p>
    </div>
  </main>

  <script>
    let allProducts = [];
    let cart = [];

    async function loadCustomerProducts() {
      try {
        const res = await fetch('/api/products');
        const data = await res.json();
        allProducts = Array.isArray(data) ? data : (data.products || []);
        renderProducts(allProducts);
      } catch (e) {
        document.getElementById('productGrid').innerHTML = '<p class="col-span-full text-center py-10 text-slate-400">No products available right now.</p>';
      }
    }

    function renderProducts(items) {
      const grid = document.getElementById('productGrid');
      if (items.length === 0) {
        grid.innerHTML = '<p class="col-span-full text-center py-10 text-slate-400">No products found.</p>';
        return;
      }
      grid.innerHTML = items.map(p => `
        <div class="bg-white border border-slate-200 rounded-xl p-4 shadow-sm flex flex-col justify-between">
          <div>
            <span class="text-[10px] font-bold uppercase tracking-wider text-blue-600 bg-blue-50 px-2 py-0.5 rounded">${p.category || 'General'}</span>
            <h3 class="font-bold text-slate-800 mt-2 text-sm">${p.title || p.name}</h3>
            <div class="text-xs text-slate-500 mt-1">Unit: ${p.unit || 'Piece'}</div>
            <div class="text-lg font-extrabold text-blue-600 mt-2">₹${p.price}</div>
          </div>
          <button onclick="addToCart('${p.id || p._id || p.title}')" class="mt-4 w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 rounded-lg text-xs transition">
            Add to Cart
          </button>
        </div>
      `).join('');
    }

    function filterCategory(cat) {
      if (cat === 'All') renderProducts(allProducts);
      else renderProducts(allProducts.filter(p => p.category === cat));
    }

    function filterCustomerProducts() {
      const q = document.getElementById('searchInput').value.toLowerCase();
      renderProducts(allProducts.filter(p => (p.title || p.name || '').toLowerCase().includes(q)));
    }

    function addToCart(id) {
      cart.push(id);
      document.getElementById('cartCount').innerText = cart.length;
      alert('Product added to cart!');
    }

    function toggleCustomerCart() {
      alert('Cart contains ' + cart.length + ' item(s). Checkout feature ready.');
    }

    document.addEventListener('DOMContentLoaded', loadCustomerProducts);
  </script>
</body>
</html>
